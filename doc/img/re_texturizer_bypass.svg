<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
  <title id="title">Untextured fragment path</title>
  <desc id="desc">When texturing is disabled, the fragment skips coordinate arithmetic and texture memory, but its payload uses the matching delay path and retains the normal texturizer latency.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52677e"/></marker><style>.bg{fill:#f5f8fc}.box{fill:#fff;stroke:#d5deea;stroke-width:2}.input{fill:#eee9fb;stroke:#9682c5;stroke-width:2}.delay{fill:#edf3fb;stroke:#7895b4;stroke-width:2}.output{fill:#e4f5f1;stroke:#59a69d;stroke-width:2}.title{font:700 21px sans-serif;fill:#1c2d42}.label{font:700 16px sans-serif;fill:#24384e}.small{font:14px sans-serif;fill:#53677d}.arrow{fill:none;stroke:#52677e;stroke-width:2.5;marker-end:url(#arrow)}</style></defs>
  <rect class="bg" width="1000" height="300" rx="18"/><text class="title" x="35" y="40">Texturing disabled · payload bypass</text><rect class="box" x="25" y="58" width="950" height="210" rx="18"/>
  <rect class="input" x="60" y="125" width="190" height="80" rx="15"/><text class="label" x="155" y="156" text-anchor="middle">Fragment accepted</text><text class="small" x="155" y="181" text-anchor="middle">RGB · X/Y · valid</text>
  <rect class="delay" x="390" y="125" width="230" height="80" rx="15"/><text class="label" x="505" y="156" text-anchor="middle">Matched delay path</text><text class="small" x="505" y="181" text-anchor="middle">same latency as sampled path</text>
  <rect class="output" x="740" y="125" width="190" height="80" rx="15"/><text class="label" x="835" y="156" text-anchor="middle">Fragment output</text><text class="small" x="835" y="181" text-anchor="middle">RGB/X/Y valid; no texel</text>
  <path class="arrow" d="M250 165 H390"/><path class="arrow" d="M620 165 H740"/><text class="small" x="680" y="148" text-anchor="middle">texture_valid = 0</text>
</svg>
