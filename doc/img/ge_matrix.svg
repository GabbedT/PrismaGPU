<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 420" role="img">
<title>Four parallel matrix rows transform one vertex position</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker></defs>
<rect width="1040" height="420" rx="14" fill="#f8fafc"/>
<rect x="25" y="160" width="190" height="85" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="120.0" y="194.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Input position</text>
<text x="120.0" y="218.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">x, y, z, w</text>
<rect x="350" y="20" width="260" height="65" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="480.0" y="44.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Matrix coefficients</text>
<text x="480.0" y="68.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">four rows</text>
<rect x="350" y="110" width="260" height="50" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="480.0" y="127.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Row 0: multiply and sum</text>
<path d="M 215 202 L 275 202 L 275 135 L 350 135" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 610 135 L 710 135 L 710 202 L 790 202" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="125" font-family="sans-serif" font-size="16" fill="#143454">x′</text>
<rect x="350" y="175" width="260" height="50" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="480.0" y="192.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Row 1: multiply and sum</text>
<path d="M 215 202 L 275 202 L 275 200 L 350 200" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 610 200 L 710 200 L 710 202 L 790 202" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="190" font-family="sans-serif" font-size="16" fill="#143454">y′</text>
<rect x="350" y="240" width="260" height="50" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="480.0" y="257.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Row 2: multiply and sum</text>
<path d="M 215 202 L 275 202 L 275 265 L 350 265" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 610 265 L 710 265 L 710 202 L 790 202" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="255" font-family="sans-serif" font-size="16" fill="#143454">z′</text>
<rect x="350" y="305" width="260" height="50" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="480.0" y="322.0" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Row 3: multiply and sum</text>
<path d="M 215 202 L 275 202 L 275 330 L 350 330" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 610 330 L 710 330 L 710 202 L 790 202" fill="none" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="320" font-family="sans-serif" font-size="16" fill="#143454">w′</text>
<rect x="790" y="160" width="220" height="85" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="900.0" y="194.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Transformed position</text>
<text x="900.0" y="218.5" text-anchor="middle" font-family="sans-serif" font-size="16" fill="#143454">Q16.16 coordinates</text>
<text x="25" y="395" font-family="sans-serif" font-size="16" fill="#334155">Texture and color pass unchanged. Results go to the triangle buffer or forward registers.</text>
</svg>
