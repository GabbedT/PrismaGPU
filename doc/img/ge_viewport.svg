<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 245" role="img">
<title>GE viewport functional diagram</title>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#2563a6"/></marker></defs>
<rect width="990" height="245" rx="14" fill="#f8fafc"/>
<rect x="25" y="25" width="160" height="90" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="105" y="61" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">Normalized x, y</text>
<text x="105" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">Q16.16</text>
<rect x="215" y="25" width="160" height="90" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="295" y="61" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">1 + x; 1 − y</text>
<text x="295" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">Offset coordinates</text>
<rect x="405" y="25" width="160" height="90" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="485" y="61" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">× W; × H</text>
<text x="485" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">Scaled coordinates</text>
<rect x="595" y="25" width="160" height="90" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="675" y="61" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">Register</text>
<text x="675" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">positions / attributes</text>
<rect x="785" y="25" width="160" height="90" rx="10" fill="#e0ecfa" stroke="#2563a6" stroke-width="2"/>
<text x="865" y="61" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">Round and convert</text>
<text x="865" y="86" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#143454">x y F16 input / F8 output</text>
<path d="M 185 70 L 215 70" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 375 70 L 405 70" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 565 70 L 595 70" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 755 70 L 785 70" stroke="#2563a6" stroke-width="2" marker-end="url(#arrow)"/>
<text x="25" y="200" font-family="sans-serif" font-size="14" fill="#334155">Z is unsigned 17-bit F16. Out-of-range triangles are discarded.</text>
</svg>