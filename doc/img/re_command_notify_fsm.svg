<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">NOTIFY command flow</title>
  <desc id="desc">The processor validates unused payload bits, drains all earlier pipeline and memory work, commits the notification, then reports its ID and either pauses or completes the list.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#52677e"/></marker>
    <style>
      .bg{fill:#f5f8fc}.panel{fill:#fff;stroke:#d5deea;stroke-width:2}.state{fill:#edf3fb;stroke:#7895b4;stroke-width:2}.run{fill:#e4f5f1;stroke:#59a69d;stroke-width:2}.wait{fill:#fff1d7;stroke:#d7a43f;stroke-width:2}.end{fill:#eee9fb;stroke:#9682c5;stroke-width:2}.fault{fill:#fce9ea;stroke:#d8878d;stroke-width:2}.title{font:700 22px sans-serif;fill:#1c2d42}.label{font:700 16px sans-serif;fill:#24384e}.small{font:14px sans-serif;fill:#53677d}.arrow{fill:none;stroke:#52677e;stroke-width:2.3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1120" height="420" rx="18"/><text class="title" x="38" y="42">NOTIFY · synchronization and report</text><rect class="panel" x="28" y="62" width="1064" height="330" rx="18"/>
  <rect class="state" x="55" y="135" width="180" height="78" rx="16"/><text class="label" x="145" y="167" text-anchor="middle">VALIDATE</text><text class="small" x="145" y="190" text-anchor="middle">unused bits are zero</text>
  <rect class="wait" x="300" y="135" width="220" height="78" rx="16"/><text class="label" x="410" y="167" text-anchor="middle">DRAIN PRIOR WORK</text><text class="small" x="410" y="190" text-anchor="middle">pipeline + memory idle</text>
  <rect class="state" x="585" y="135" width="190" height="78" rx="16"/><text class="label" x="680" y="167" text-anchor="middle">COMMIT</text><text class="small" x="680" y="190" text-anchor="middle">retire NOTIFY</text>
  <rect class="run" x="840" y="135" width="210" height="78" rx="16"/><text class="label" x="945" y="167" text-anchor="middle">REPORT ID</text><text class="small" x="945" y="190" text-anchor="middle">publish notification</text>
  <rect class="end" x="300" y="275" width="220" height="72" rx="16"/><text class="label" x="410" y="305" text-anchor="middle">PAUSED</text><text class="small" x="410" y="328" text-anchor="middle">commands remain</text>
  <rect class="end" x="585" y="275" width="190" height="72" rx="16"/><text class="label" x="680" y="305" text-anchor="middle">DONE</text><text class="small" x="680" y="328" text-anchor="middle">last command</text>
  <rect class="fault" x="55" y="275" width="180" height="72" rx="16"/><text class="label" x="145" y="305" text-anchor="middle">ERROR_DRAIN</text><text class="small" x="145" y="328" text-anchor="middle">report invalid / failure</text>
  <path class="arrow" d="M235 174 H300"/><text class="small" x="267" y="158" text-anchor="middle">valid</text>
  <path class="arrow" d="M520 174 H585"/><text class="small" x="552" y="158" text-anchor="middle">all work drained</text>
  <path class="arrow" d="M775 174 H840"/><text class="small" x="807" y="158" text-anchor="middle">commit pulse</text>
  <path class="arrow" d="M880 213 V245 H410 V275"/><text class="small" x="620" y="235" text-anchor="middle">more commands remain</text>
  <path class="arrow" d="M1010 213 V260 H680 V275"/><text class="small" x="820" y="253" text-anchor="middle">list ends here</text>
  <path class="arrow" d="M145 213 V275"/><text class="small" x="175" y="252">invalid payload</text>
</svg>
